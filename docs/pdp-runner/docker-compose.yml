# pdp-runner — creacion de PDPs de Electrificarte con OpenCode (reemplaza al Managed Agent).
# Stack propio: no toca n8n-cadre. Se une a su red solo para que el tunel de Cloudflare lo alcance.
services:
  pdp-runner:
    image: node:22-bookworm-slim
    container_name: pdp-runner
    restart: unless-stopped
    user: "${UID_GID:-1001:1001}"
    working_dir: /app
    command: ["node", "server.mjs"]
    env_file: [.env]
    environment:
      HOME: /app/.home
      OPENCODE_BIN: /app/.home/.opencode/bin/opencode
      PORT: "4100"
    volumes:
      - ./:/app
      - ${HOME}/.opencode:/app/.home/.opencode:ro
      # auth.json (sesion de Copilot) + datos de opencode. rw: el token OAuth se refresca solo.
      - ${HOME}/.local/share/opencode:/app/.home/.local/share/opencode
      - ${HOME}/.cache/opencode:/app/.home/.cache/opencode
    mem_limit: 1g
    networks: [n8n]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
networks:
  n8n:
    external: true
    name: n8n-cadre_default
